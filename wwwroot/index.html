<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أخبار التوطين وسوق العمل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f1f4fb; --surface:#ffffff; --ink:#00122D; --muted:#4a5878; --line:#d5dcec;
  --accent:#0064FF; --accent-soft:#e6eeff; --on-accent:#ffffff;
  --green:#00BF00; --purple:#A37DFC; --navy:#00004E; --focus:#0064FF;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#00122D; --surface:#00004E; --ink:#FFFFFF; --muted:#b9c4de; --line:#1d3a7a;
    --accent:#0064FF; --accent-soft:#0b1f5c; --on-accent:#FFFFFF; --focus:#A37DFC;
  }
}
:root[data-theme="dark"]{
  --bg:#00122D; --surface:#00004E; --ink:#FFFFFF; --muted:#b9c4de; --line:#1d3a7a;
  --accent:#0064FF; --accent-soft:#0b1f5c; --on-accent:#FFFFFF; --focus:#A37DFC;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif;line-height:1.8}
.top{background:var(--navy);border-bottom:5px solid var(--green);color:#FFFFFF}
.top .inner{max-width:760px;margin:0 auto;padding:26px 18px 22px}
.top .sub{color:#FFFFFF;opacity:.82;margin:0}
.wrap{max-width:760px;margin:0 auto;padding:24px 18px 56px}
h1{font-size:1.7rem;margin:0 0 4px;font-weight:700}
.sub{margin:0 0 18px;color:var(--muted);font-size:.95rem}
.note{background:var(--accent-soft);border-inline-start:4px solid var(--purple);padding:10px 14px;border-radius:6px;font-size:.9rem;margin-bottom:20px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.search{flex:1 1 220px;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
.chips{display:flex;gap:8px}
.chip{padding:8px 16px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.search:focus-visible,.chip:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.count{color:var(--muted);font-size:.9rem;margin:0 0 8px}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.item{display:grid;grid-template-columns:92px 1fr;gap:16px;padding:18px 14px;border-bottom:1px solid var(--line);border-inline-start:4px solid transparent}
.item.loc{border-inline-start-color:var(--green);background:var(--surface)}
.date{color:var(--muted);font-size:.88rem;padding-top:3px}
.item h2{font-size:1.08rem;line-height:1.6;margin:0 0 4px;font-weight:700}
.item h2 a{color:inherit;text-decoration:none}
.item h2 a:hover{text-decoration:underline}
.item p{margin:0 0 6px;color:var(--muted);font-size:.95rem}
.tag{display:inline-block;background:var(--green);color:#00122D;font-size:.78rem;padding:1px 10px;border-radius:999px;font-weight:500}
.empty{padding:28px 14px;color:var(--muted)}
@media (max-width:520px){.item{grid-template-columns:1fr;gap:2px}}
</style>
</head>
<body>
<header class="top"><div class="inner">
  <h1>أخبار التوطين وسوق العمل</h1>
  <p class="sub">من المركز الإعلامي لوزارة الموارد البشرية والتنمية الاجتماعية</p>
</div></header>
<main class="wrap">
  <div class="note" id="status" aria-live="polite">جارٍ تحميل الأخبار…</div>

  <div class="tools">
    <input class="search" id="q" type="search" placeholder="ابحث في الأخبار" aria-label="ابحث في الأخبار">
    <div class="chips" role="group" aria-label="تصفية">
      <button class="chip" id="b-loc" aria-pressed="true">التوطين</button>
      <button class="chip" id="b-all" aria-pressed="false">كل الأخبار</button>
    </div>
  </div>
  <p class="count" id="count" aria-live="polite"></p>
  <ul class="list" id="list"></ul>
</main>

<script>
var mode = "loc";
var NEWS = [];
var list = document.getElementById("list"), q = document.getElementById("q"),
    count = document.getElementById("count"), statusEl = document.getElementById("status");
var fmt = new Intl.DateTimeFormat("ar-SA-u-ca-gregory", {day:"numeric", month:"long", year:"numeric"});

function render(){
  var term = q.value.trim();
  var rows = NEWS.filter(function(n){
    return (mode === "all" || n.isLocalization) && (!term || (n.title + " " + n.summary).indexOf(term) > -1);
  });
  count.textContent = rows.length + " خبر";
  list.innerHTML = "";
  if(!rows.length){
    var li = document.createElement("li"); li.className = "empty";
    li.textContent = "لا توجد نتائج. جرّب كلمة أخرى أو اعرض كل الأخبار.";
    list.appendChild(li); return;
  }
  rows.forEach(function(n){
    var li = document.createElement("li"); li.className = "item" + (n.isLocalization ? " loc" : "");
    var d = document.createElement("div"); d.className = "date";
    d.textContent = n.date ? fmt.format(new Date(n.date)) : "";
    var b = document.createElement("div");
    var h = document.createElement("h2"), a = document.createElement("a");
    a.href = n.link; a.target = "_blank"; a.rel = "noopener"; a.textContent = n.title; h.appendChild(a);
    var p = document.createElement("p"); p.textContent = n.summary;
    b.appendChild(h); b.appendChild(p);
    if(n.isLocalization){ var t = document.createElement("span"); t.className = "tag"; t.textContent = "توطين"; b.appendChild(t); }
    li.appendChild(d); li.appendChild(b); list.appendChild(li);
  });
}
function setMode(m){
  mode = m;
  document.getElementById("b-loc").setAttribute("aria-pressed", m === "loc");
  document.getElementById("b-all").setAttribute("aria-pressed", m === "all");
  render();
}
document.getElementById("b-loc").onclick = function(){ setMode("loc"); };
document.getElementById("b-all").onclick = function(){ setMode("all"); };
q.addEventListener("input", render);

fetch("/api/news")
  .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(function(data){
    NEWS = data.items;
    var when = new Intl.DateTimeFormat("ar-SA-u-ca-gregory", {dateStyle:"medium", timeStyle:"short"}).format(new Date(data.fetchedAt));
    statusEl.textContent = (data.isStale ? "تعذّر التحديث، هذه آخر نسخة محفوظة. " : "") + "آخر تحديث: " + when;
    render();
  })
  .catch(function(){
    statusEl.textContent = "تعذّر تحميل الأخبار. تأكد من تشغيل المشروع وأن الجهاز متصل بالإنترنت، ثم أعد تحميل الصفحة.";
    count.textContent = "";
  });
</script>
</body>
</html>
